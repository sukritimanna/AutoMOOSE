name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # pytest runs the suite; mcp + httpx let the MCP tool-contract test
          # import the server module. No MOOSE binary and no API key are needed:
          # the suite exercises only pure-Python modules and the declared tool list.
          pip install pytest mcp httpx

      - name: Run offline test suite
        run: pytest -q tests/
